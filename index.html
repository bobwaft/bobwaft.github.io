<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donovan · Software developer</title>
    <meta
      name="description"
      content="Explore Donovan's desk in 3D: about, resume and projects from a software developer studying Computer Science at UBC in Vancouver."
    />
    <meta property="og:title" content="Donovan · Software developer" />
    <meta
      property="og:description"
      content="Explore Donovan's desk in 3D: about, resume and projects from a software developer studying Computer Science at UBC in Vancouver."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bobwaft.github.io/" />
    <meta property="og:image" content="https://bobwaft.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Donovan's desk in 3D: a laptop, notebook and resume under a warm lamp."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      #fallback {
        position: fixed;
        inset: 0;
        z-index: 20;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 2rem 1.25rem 4rem;
        background: #111;
        color: #ddd;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      #fallback > * {
        max-width: 40rem;
        margin-left: auto;
        margin-right: auto;
      }
      #fallback h1,
      #fallback h2,
      #fallback h3 {
        color: #fff;
        line-height: 1.25;
      }
      #fallback h2 {
        margin-top: 2.5rem;
        padding-bottom: 0.25rem;
        border-bottom: 1px solid #333;
      }
      #fallback a {
        color: #8ec5ff;
      }
      #fallback :focus-visible,
      #skip-3d:focus-visible {
        outline: 2px solid #ffd479;
        outline-offset: 2px;
      }
      #fallback img,
      #fallback video {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 6px;
      }
      #fallback .photo {
        max-width: 14rem;
        margin-bottom: 1rem;
      }
      #fallback article {
        margin: 1.5rem 0;
        padding: 1rem 1.25rem;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
      }
      #fallback article h3 {
        margin: 0;
      }
      #fallback .dates {
        margin: 0.25rem 0;
        color: #aaa;
      }
      #fallback ul.tags,
      #fallback ul.links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 0.9rem;
        margin: 0.5rem 0;
        padding: 0;
        list-style: none;
      }
      #fallback ul.tags li {
        padding: 0 0.5rem;
        border: 1px solid #444;
        border-radius: 999px;
        font-size: 0.85rem;
      }
      #fallback button {
        margin: 2rem auto 0;
        padding: 0.5rem 0.9rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: #222;
        color: #eee;
        font: inherit;
        cursor: pointer;
      }
      #skip-3d {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 30;
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.6);
        color: #aaa;
        font:
          0.75rem system-ui,
          sans-serif;
        text-decoration: none;
      }
      #skip-3d:hover {
        color: #fff;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #111;
        color: #bbb;
        font:
          0.875rem system-ui,
          sans-serif;
        opacity: 1;
        transition: opacity 0.5s ease;
        z-index: 10;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading-bar {
        width: min(240px, 60vw);
        height: 2px;
        background: #333;
      }
      #loading-fill {
        width: 0;
        height: 100%;
        background: #ccc;
      }
      #back-button {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 5;
        padding: 0.5rem 0.9rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.75);
        color: #eee;
        font:
          0.9rem system-ui,
          sans-serif;
        cursor: pointer;
      }
      #back-button:hover,
      #back-button:focus-visible {
        background: rgba(40, 40, 40, 0.9);
        border-color: #aaa;
      }
      #hover-label {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 4;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        background: rgba(17, 17, 17, 0.8);
        color: #eee;
        font:
          0.8rem system-ui,
          sans-serif;
        pointer-events: none;
        white-space: nowrap;
      }
      #hover-label.keyboard {
        outline: 2px solid #fff;
        outline-offset: 2px;
        font-size: 1rem;
      }
      #interactables {
        position: fixed;
      }
      #interactables button {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .touch-dot {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 3;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6);
        pointer-events: none;
        transition: opacity 0.4s ease;
        animation: dot-pulse 1.8s ease-out infinite;
      }
      @keyframes dot-pulse {
        to {
          box-shadow: 0 0 0 16px rgba(255, 255, 255, 0);
        }
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        z-index: 4;
        transform: translateX(-50%);
        max-width: 90vw;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.7);
        color: #ddd;
        font:
          0.85rem system-ui,
          sans-serif;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #hint.show {
        opacity: 1;
      }
      #now-playing {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        z-index: 3;
        max-width: calc(100vw - 2rem);
        padding: 0.3rem 0.7rem;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.55);
        color: #bbb;
        font:
          0.75rem system-ui,
          sans-serif;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #now-playing.show {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #hint,
        #now-playing {
          transition: none;
        }
        .touch-dot {
          animation: none;
          transition: none;
        }
        #loading {
          transition: none;
        }
      }
    </style>
    <noscript>
      <style>
        #fallback {
          display: block !important;
        }
        #app,
        #loading,
        #skip-3d {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <a id="skip-3d" href="#fallback">Skip the 3D</a>
    <div id="app"><canvas id="scene" aria-hidden="true"></canvas></div>
    <div id="loading" role="status" aria-live="polite">
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-pct">0%</div>
    </div>
    <main id="fallback" hidden><!--fallback:start--><!--fallback:end--></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
