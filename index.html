<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bobwaft</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      #fallback {
        padding: 2rem;
        color: #ddd;
        font:
          1rem system-ui,
          sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #111;
        color: #bbb;
        font:
          0.875rem system-ui,
          sans-serif;
        opacity: 1;
        transition: opacity 0.5s ease;
        z-index: 10;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading-bar {
        width: min(240px, 60vw);
        height: 2px;
        background: #333;
      }
      #loading-fill {
        width: 0;
        height: 100%;
        background: #ccc;
      }
      #back-button {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 5;
        padding: 0.5rem 0.9rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.75);
        color: #eee;
        font:
          0.9rem system-ui,
          sans-serif;
        cursor: pointer;
      }
      #back-button:hover,
      #back-button:focus-visible {
        background: rgba(40, 40, 40, 0.9);
        border-color: #aaa;
      }
      @media (prefers-reduced-motion: reduce) {
        #loading {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="scene"></canvas></div>
    <div id="loading" role="status" aria-live="polite">
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-pct">0%</div>
    </div>
    <main id="fallback" hidden>
      <h1>bobwaft</h1>
      <p>A simpler version of this site is coming.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
