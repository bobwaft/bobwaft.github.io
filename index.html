<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donovan · Software developer</title>
    <meta
      name="description"
      content="Explore Donovan's desk in 3D: about, resume and projects from a software developer studying Computer Science at UBC in Vancouver."
    />
    <meta property="og:title" content="Donovan · Software developer" />
    <meta
      property="og:description"
      content="Explore Donovan's desk in 3D: about, resume and projects from a software developer studying Computer Science at UBC in Vancouver."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bobwaft.github.io/" />
    <meta property="og:image" content="https://bobwaft.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Donovan's desk in 3D: a laptop, notebook and resume under a warm lamp."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      /* "Skip the 3D" works as a plain link before the script has loaded. */
      #fallback:target {
        display: block !important;
      }
      body:has(#fallback:target) #skip-3d {
        display: none;
      }
      /* The simple site, in the about page's Mocha look (src/ui/about.css); the fonts come from
         the bundled stylesheet, with Georgia/system-ui as the no-font fallback. */
      #fallback {
        --espresso: #2a1c15;
        --mocha: #6f4e3d;
        --latte: #c4a283;
        --caramel: #b8733d;
        --cream: #efe4d4;
        --foam: #f8f2e9;
        --serif: 'Fraunces Variable', Georgia, serif;
        --sans: 'DM Sans Variable', system-ui, sans-serif;
        --hand: 'Caveat', cursive;
        position: fixed;
        inset: 0;
        z-index: 20;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 5rem 1.25rem 4rem;
        background-color: var(--foam);
        background-image:
          radial-gradient(circle at 12% 18%, rgb(196 162 131 / 0.18), transparent 40%),
          radial-gradient(circle at 88% 82%, rgb(184 115 61 / 0.12), transparent 45%);
        background-attachment: fixed;
        color: var(--espresso);
        font: 1rem/1.6 var(--sans);
      }
      #fallback > * {
        max-width: 60rem;
        margin-left: auto;
        margin-right: auto;
      }
      #fallback a {
        color: var(--caramel);
      }
      #fallback :focus-visible,
      #skip-3d:focus-visible {
        outline: 2px solid var(--caramel, #ffd479);
        outline-offset: 3px;
      }
      #fallback img,
      #fallback video {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .fb-hero {
        display: flex;
        flex-wrap: wrap-reverse;
        gap: 3rem;
        align-items: center;
        justify-content: space-between;
      }
      .fb-intro {
        flex: 1 1 22rem;
      }
      .fb-title {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(2.5rem, 7vw, 3.75rem);
        font-weight: 300;
        line-height: 1.1;
      }
      .fb-title:focus {
        outline: none;
      }
      .fb-em,
      .fb-accent {
        font-style: italic;
      }
      .fb-accent {
        color: var(--caramel);
        font-weight: 600;
      }
      .fb-location {
        margin: 0.75rem 0 0;
        color: rgb(111 78 61 / 0.75);
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .fb-text {
        max-width: 36rem;
        margin-top: 2rem;
        padding-left: 1.5rem;
        border-left: 1px solid rgb(196 162 131 / 0.6);
        color: var(--mocha);
        font-size: 1.05rem;
      }
      .fb-hello {
        margin: 2rem 0 0.75rem;
        color: var(--espresso);
        font-family: var(--serif);
        font-style: italic;
        font-size: 1.25rem;
      }
      .fb-contact {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
      }
      #fallback .fb-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border: 1px solid rgb(196 162 131 / 0.6);
        border-radius: 9999px;
        background: rgb(248 242 233 / 0.6);
        color: var(--espresso);
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        text-decoration: none;
      }
      #fallback .fb-pill:hover,
      #fallback .fb-pill:focus-visible {
        border-color: var(--espresso);
        background: var(--espresso);
        color: var(--foam);
      }
      .fb-pill-detail {
        color: rgb(111 78 61 / 0.6);
        font-weight: 400;
        overflow-wrap: anywhere;
      }
      .fb-pill:hover .fb-pill-detail,
      .fb-pill:focus-visible .fb-pill-detail {
        color: rgb(239 228 212 / 0.7);
      }
      .fb-icon {
        flex: none;
        width: 16px;
        height: 16px;
        color: var(--caramel);
      }
      .fb-socials {
        display: flex;
        gap: 0.25rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #fallback .fb-social {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        color: var(--mocha);
      }
      #fallback .fb-social:hover,
      #fallback .fb-social:focus-visible {
        background: var(--espresso);
        color: var(--foam);
      }
      .fb-social .fb-icon {
        width: 22px;
        height: 22px;
        color: inherit;
      }
      .fb-portrait {
        position: relative;
        flex: 0 1 16rem;
        margin: 1rem auto;
      }
      .fb-ring {
        position: absolute;
        inset: -16px;
        border: 1px solid rgb(196 162 131 / 0.5);
        border-radius: 9999px 9999px 0 0;
      }
      .fb-arch {
        position: relative;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        border-radius: 9999px 9999px 0 0;
        background: linear-gradient(to bottom, var(--cream), rgb(196 162 131 / 0.7));
        box-shadow: inset 0 0 0 1px rgb(196 162 131 / 0.5);
      }
      #fallback .fb-photo {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 92%;
        object-fit: cover;
        object-position: top;
      }
      .fb-note {
        position: absolute;
        top: -8px;
        right: -16px;
        transform: rotate(6deg);
        color: var(--caramel);
        font: 500 1.5rem/2rem var(--hand);
      }
      .fb-projects {
        margin-top: 4.5rem;
      }
      .fb-projects h2 {
        margin: 0 0 1.5rem;
        font-family: var(--serif);
        font-size: 2.25rem;
        font-weight: 300;
      }
      .fb-card {
        margin: 0 0 1.5rem;
        padding: 1.5rem;
        border: 1px solid rgb(196 162 131 / 0.5);
        border-radius: 1.25rem;
        background: rgb(239 228 212 / 0.55);
        color: var(--mocha);
      }
      .fb-card h3 {
        margin: 0;
        color: var(--espresso);
        font-family: var(--serif);
        font-size: 1.6rem;
        font-weight: 400;
        line-height: 1.2;
      }
      .fb-card img,
      .fb-card video {
        margin: 1rem 0;
        border-radius: 0.75rem;
      }
      .fb-video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        margin: 1rem 0;
        border: 0;
        border-radius: 0.75rem;
        background: var(--cream);
      }
      .fb-gallery {
        display: flex;
        gap: 0.75rem;
        margin: 1rem 0;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        border-radius: 0.75rem;
      }
      #fallback .fb-gallery img {
        flex: 0 0 100%;
        width: 100%;
        margin: 0;
        object-fit: contain;
        scroll-snap-align: start;
      }
      #fallback .dates {
        margin: 0.25rem 0 0.75rem;
        color: rgb(111 78 61 / 0.75);
        font-size: 0.9rem;
      }
      #fallback ul.tags,
      #fallback ul.links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 0.6rem;
        margin: 0.5rem 0;
        padding: 0;
        list-style: none;
      }
      #fallback ul.tags li {
        padding: 0.1rem 0.65rem;
        border: 1px solid rgb(196 162 131 / 0.6);
        border-radius: 9999px;
        background: rgb(248 242 233 / 0.7);
        color: var(--espresso);
        font-size: 0.8rem;
      }
      #fallback ul.links a {
        font-weight: 500;
      }
      #fallback .fb-note {
        margin: 0.5rem 0 1rem;
        color: var(--caramel);
        font: 500 1.5rem/1.3 var(--hand);
      }
      .fb-more {
        color: var(--caramel);
        font: 500 1.5rem var(--hand);
        text-align: center;
      }
      #skip-3d {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 30;
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.6);
        color: #aaa;
        font:
          0.75rem system-ui,
          sans-serif;
        text-decoration: none;
      }
      #skip-3d:hover {
        color: #fff;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #111;
        color: #bbb;
        font:
          0.875rem system-ui,
          sans-serif;
        opacity: 1;
        transition: opacity 0.5s ease;
        z-index: 10;
      }
      /* Opening animation (src/ui/intro.ts): shut eyelids under the loading screen, same colour so
         the hand-off has no seam. Each lid's inner edge is curved and feathered; the heights
         overlap so they meet with no gap when shut. */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 9;
        overflow: hidden;
        pointer-events: none;
      }
      #intro .lid {
        position: absolute;
        left: -10%;
        right: -10%;
        height: calc(50% + 14vh + 1px);
        background: #111;
        will-change: transform;
      }
      #intro .lid-top {
        top: 0;
        border-radius: 0 0 50% 50% / 0 0 14vh 14vh;
        box-shadow: 0 14px 50px 24px #111;
      }
      #intro .lid-bottom {
        bottom: 0;
        border-radius: 50% 50% 0 0 / 14vh 14vh 0 0;
        box-shadow: 0 -14px 50px 24px #111;
      }
      /* "Click to start" replaces the loading bar once everything has loaded: plain text, and the
         whole screen is the click target. */
      #loading.ready {
        cursor: pointer;
      }
      #start-prompt {
        margin: 0;
        color: #bbb;
        font:
          400 20px/28px 'DM Sans Variable',
          system-ui,
          sans-serif;
        letter-spacing: 0.04em;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading-bar {
        width: min(240px, 60vw);
        height: 2px;
        background: #333;
      }
      #loading-fill {
        width: 0;
        height: 100%;
        background: #ccc;
      }
      #back-button {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 5;
        padding: 0.5rem 0.9rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.75);
        color: #eee;
        font:
          0.9rem system-ui,
          sans-serif;
        cursor: pointer;
      }
      #back-button:hover,
      #back-button:focus-visible {
        background: rgba(40, 40, 40, 0.9);
        border-color: #aaa;
      }
      #hover-label {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 4;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        background: rgba(17, 17, 17, 0.8);
        color: #eee;
        font:
          0.8rem system-ui,
          sans-serif;
        pointer-events: none;
        white-space: nowrap;
      }
      #hover-label.keyboard {
        outline: 2px solid #fff;
        outline-offset: 2px;
        font-size: 1rem;
      }
      #interactables {
        position: fixed;
      }
      #interactables button {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .touch-dot {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 3;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6);
        pointer-events: none;
        transition: opacity 0.4s ease;
        animation: dot-pulse 1.8s ease-out infinite;
      }
      @keyframes dot-pulse {
        to {
          box-shadow: 0 0 0 16px rgba(255, 255, 255, 0);
        }
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        z-index: 4;
        transform: translateX(-50%);
        max-width: 90vw;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.7);
        color: #ddd;
        font:
          0.85rem system-ui,
          sans-serif;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #hint.show {
        opacity: 1;
      }
      #now-playing {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        z-index: 3;
        /* Capped to clear "Skip the 3D" in the opposite corner; a longer credit scrolls. */
        box-sizing: border-box;
        max-width: min(26rem, calc(100vw - 9rem));
        padding: 0.3rem 0.7rem;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.55);
        color: #bbb;
        font:
          0.75rem system-ui,
          sans-serif;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #now-playing.show {
        opacity: 1;
      }
      #now-playing .np-window {
        display: block;
        overflow: hidden;
        white-space: nowrap;
      }
      #now-playing .np-text {
        display: inline-block;
      }
      #now-playing.scroll .np-window {
        mask-image: linear-gradient(90deg, #000 calc(100% - 1rem), transparent);
      }
      #now-playing.scroll .np-text {
        animation: np-scroll var(--np-seconds, 8s) ease-in-out infinite alternate;
      }
      /* Pause at each end (15% of a pass), move in between. */
      @keyframes np-scroll {
        0%,
        15% {
          transform: translateX(0);
        }
        85%,
        100% {
          transform: translateX(var(--np-shift, 0));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hint,
        #now-playing {
          transition: none;
        }
        /* No scroll: inline text, so the overflow ends in an ellipsis instead. */
        #now-playing.scroll .np-text {
          display: inline;
          animation: none;
        }
        #now-playing .np-window {
          text-overflow: ellipsis;
        }
        #now-playing.scroll .np-window {
          mask-image: none;
        }
        .touch-dot {
          animation: none;
          transition: none;
        }
        #loading {
          transition: none;
        }
      }
    </style>
    <noscript>
      <style>
        #fallback {
          display: block !important;
        }
        #app,
        #loading,
        #skip-3d {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <a id="skip-3d" href="#fallback">Skip the 3D</a>
    <div id="app"><canvas id="scene" aria-hidden="true"></canvas></div>
    <div id="loading" role="status" aria-live="polite">
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-pct">0%</div>
    </div>
    <main id="fallback" hidden><!--fallback:start--><!--fallback:end--></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
