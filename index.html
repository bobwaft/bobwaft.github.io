<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bobwaft</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      #fallback {
        padding: 2rem;
        color: #ddd;
        font:
          1rem system-ui,
          sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #111;
        color: #bbb;
        font:
          0.875rem system-ui,
          sans-serif;
        opacity: 1;
        transition: opacity 0.5s ease;
        z-index: 10;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading-bar {
        width: min(240px, 60vw);
        height: 2px;
        background: #333;
      }
      #loading-fill {
        width: 0;
        height: 100%;
        background: #ccc;
      }
      #back-button {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 5;
        padding: 0.5rem 0.9rem;
        border: 1px solid #555;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.75);
        color: #eee;
        font:
          0.9rem system-ui,
          sans-serif;
        cursor: pointer;
      }
      #back-button:hover,
      #back-button:focus-visible {
        background: rgba(40, 40, 40, 0.9);
        border-color: #aaa;
      }
      #hover-label {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 4;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        background: rgba(17, 17, 17, 0.8);
        color: #eee;
        font:
          0.8rem system-ui,
          sans-serif;
        pointer-events: none;
        white-space: nowrap;
      }
      .touch-dot {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 3;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6);
        pointer-events: none;
        transition: opacity 0.4s ease;
        animation: dot-pulse 1.8s ease-out infinite;
      }
      @keyframes dot-pulse {
        to {
          box-shadow: 0 0 0 16px rgba(255, 255, 255, 0);
        }
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        z-index: 4;
        transform: translateX(-50%);
        max-width: 90vw;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.7);
        color: #ddd;
        font:
          0.85rem system-ui,
          sans-serif;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #hint.show {
        opacity: 1;
      }
      #now-playing {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        z-index: 3;
        max-width: calc(100vw - 2rem);
        padding: 0.3rem 0.7rem;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.55);
        color: #bbb;
        font:
          0.75rem system-ui,
          sans-serif;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #now-playing.show {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #hint,
        #now-playing {
          transition: none;
        }
        .touch-dot {
          animation: none;
          transition: none;
        }
        #loading {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="scene"></canvas></div>
    <div id="loading" role="status" aria-live="polite">
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-pct">0%</div>
    </div>
    <main id="fallback" hidden>
      <h1>bobwaft</h1>
      <p>A simpler version of this site is coming.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
